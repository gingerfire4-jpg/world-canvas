<!DOCTYPE html>
<html>
<head>
<title>Stable Infinite Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CAMERA LAYER */
#stage {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
}

/* CANVAS (DRAWING ONLY) */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:99999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:10px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<!-- CAMERA WORLD -->
<div id="stage"></div>

<!-- DRAW CANVAS -->
<canvas id="canvas"></canvas>

<!-- UI -->
<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">🔤 Add Text</div>
    <div class="item" onclick="addYT()">📺 Add YouTube</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw Mode</div>
  </div>
</div>

<script>

const stage = document.getElementById("stage");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

/* UI MENU */
const menu = document.getElementById("menu");

document.getElementById("plus").onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* DRAW SYSTEM */
let drawMode = false;

function toggleDraw(){
  drawMode = !drawMode;
}

/* TEXT */
function addText(){

  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";

  el.style.left = "400px";
  el.style.top = "400px";

  makeDraggable(el);
  stage.appendChild(el);
}

/* YOUTUBE */
function addYT(){

  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";

  el.style.left = "500px";
  el.style.top = "500px";
  el.style.padding = "0";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  makeDraggable(el);
  stage.appendChild(el);
}

/* DRAG SYSTEM */
function makeDraggable(el){

  let dragging = false;
  let ox = 0;
  let oy = 0;

  el.addEventListener("mousedown",(e)=>{

    dragging = true;

    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    el.style.left = (e.clientX - ox) + "px";
    el.style.top = (e.clientY - oy) + "px";
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* PAN + ZOOM */
let draggingCam = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  draggingCam = true;
  last.x = e.clientX;
  last.y = e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{

  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;

  last.x = e.clientX;
  last.y = e.clientY;

  if(draggingCam){
    cam.x -= dx;
    cam.y -= dy;
    stage.style.transform =
      `translate(${cam.x}px,${cam.y}px) scale(${cam.zoom})`;
  }

  if(drawMode && e.buttons){
    ctx.fillStyle="black";
    ctx.fillRect(e.clientX, e.clientY, 3, 3);
  }
});

/* ZOOM */
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  const zoomFactor = 1.1;
  const mouseX = e.clientX;
  const mouseY = e.clientY;

  const worldX = (mouseX - cam.x) / cam.zoom;
  const worldY = (mouseY - cam.y) / cam.zoom;

  cam.zoom *= (e.deltaY < 0) ? zoomFactor : 1/zoomFactor;
  cam.zoom = Math.max(0.2, Math.min(5, cam.zoom));

  cam.x = mouseX - worldX * cam.zoom;
  cam.y = mouseY - worldY * cam.zoom;

  stage.style.transform =
    `translate(${cam.x}px,${cam.y}px) scale(${cam.zoom})`;

},{passive:false});

</script>

</body>
</html>
