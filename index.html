<!DOCTYPE html>
<html>
<head>
<title>Stable Infinite Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CAMERA */
#camera {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
}

/* WORLD */
#world {
  position:relative;
  width:20000px;
  height:20000px;
  background:#f5f5f5;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:grab;
}

iframe {
  position:absolute;
  width:320px;
  height:200px;
  border:none;
  cursor:grab;
}

canvas.draw {
  position:absolute;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="camera">
  <div id="world"></div>
</div>

<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">🔤 Text</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>
    <div class="item" onclick="addYT()">📺 YouTube</div>
  </div>
</div>

<script>
const camera = document.getElementById("camera");
const world = document.getElementById("world");

/* CAMERA */
let camX = 0;
let camY = 0;
let scale = 1;

function render(){
  camera.style.transform =
    `translate(${camX}px,${camY}px) scale(${scale})`;
}

/* MENU */
const menu = document.getElementById("menu");

document.getElementById("plus").onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* PAN */
let draggingCamera = false;
let dragTarget = null;
let lastX = 0;
let lastY = 0;

/* IMPORTANT: global pointer mode */
let drawMode = false;
let drawing = false;
let canvas = null;
let ctx = null;

/* POINTER DOWN */
document.addEventListener("mousedown",(e)=>{

  lastX = e.clientX;
  lastY = e.clientY;

  /* UI ignored */
  if(e.target.closest("#ui")) return;

  /* TEXT / VIDEO DRAG */
  if(e.target.closest(".node") || e.target.tagName === "IFRAME") {
    dragTarget = e.target.closest(".node") || e.target;
    return;
  }

  /* DRAW MODE */
  if(drawMode) {

    const wx = (e.clientX - camX) / scale;
    const wy = (e.clientY - camY) / scale;

    canvas = document.createElement("canvas");
    canvas.width = 2000;
    canvas.height = 2000;
    canvas.className = "draw";

    canvas.style.left = wx + "px";
    canvas.style.top = wy + "px";

    ctx = canvas.getContext("2d");
    world.appendChild(canvas);

    drawing = true;
    return;
  }

  /* CAMERA DRAG */
  draggingCamera = true;
});

/* MOVE */
document.addEventListener("mousemove",(e)=>{

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;

  /* MOVE TEXT / VIDEO */
  if(dragTarget) {
    dragTarget.style.left =
      (parseFloat(dragTarget.style.left || 0) + dx / scale) + "px";

    dragTarget.style.top =
      (parseFloat(dragTarget.style.top || 0) + dy / scale) + "px";

    return;
  }

  /* DRAW */
  if(drawing && ctx) {
    const wx = (e.clientX - camX) / scale;
    const wy = (e.clientY - camY) / scale;

    ctx.fillRect(wx, wy, 4, 4);
    return;
  }

  /* CAMERA */
  if(draggingCamera) {
    camX += dx;
    camY += dy;
    render();
  }
});

/* RELEASE */
document.addEventListener("mouseup",()=>{

  draggingCamera = false;
  dragTarget = null;
  drawing = false;
  canvas = null;
  ctx = null;
});

/* ZOOM */
document.addEventListener("wheel",(e)=>{
  e.preventDefault();

  let zoom = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= zoom;
  scale = Math.max(0.2, Math.min(4, scale));

  render();
},{passive:false});

/* TEXT */
function addText(){
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";
  el.style.left = "500px";
  el.style.top = "500px";
  world.appendChild(el);
}

/* YOUTUBE */
function addYT(){
  let url = prompt("Paste YouTube link:");
  if(!url) return;

  let id;

  if(url.includes("v=")){
    id = url.split("v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1];
  }

  if(!id) return alert("Invalid link");

  const wrapper = document.createElement("div");
  wrapper.className = "node";
  wrapper.style.width = "320px";
  wrapper.style.height = "200px";
  wrapper.style.padding = "0";

  wrapper.style.left = "700px";
  wrapper.style.top = "700px";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  wrapper.appendChild(iframe);
  world.appendChild(wrapper);
}

/* DRAW MODE TOGGLE */
function toggleDraw(){
  drawMode = !drawMode;
  alert("Draw: " + (drawMode ? "ON" : "OFF"));
}
</script>

</body>
</html>
