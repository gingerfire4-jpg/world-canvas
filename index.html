<!DOCTYPE html>
<html>
<head>
<title>Stable World Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CANVAS BACKGROUND */
canvas {
  position:fixed;
  top:0;
  left:0;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:99999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  background:white;
  border:1px solid #ccc;
  border-radius:10px;
  margin-top:10px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
  user-select:none;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">Add Text</div>
    <div class="item" onclick="addYT()">Add YouTube</div>
    <div class="item" onclick="toggleDraw()">Draw Mode</div>
  </div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

/* WORLD OBJECTS */
let objects = [];

/* UI */
document.getElementById("plus").onclick = () => {
  const m = document.getElementById("menu");
  m.style.display = m.style.display === "block" ? "none" : "block";
};

/* DRAW MODE */
let drawMode = false;

function toggleDraw(){
  drawMode = !drawMode;
}

/* =========================
   WORLD OBJECT SYSTEM
   ========================= */

function createObject(el, x, y){

  const obj = {
    el,
    x,
    y
  };

  objects.push(obj);
  document.body.appendChild(el);

  enableDrag(obj);

  render();
}

/* TEXT */
function addText(){

  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";

  createObject(el, cam.x + 200, cam.y + 200);
}

/* YOUTUBE */
function addYT(){

  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";
  el.style.padding = "0";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  createObject(el, cam.x + 200, cam.y + 200);
}

/* DRAG SYSTEM (WORLD BASED FIX) */
function enableDrag(obj){

  let dragging = false;
  let ox = 0;
  let oy = 0;

  obj.el.addEventListener("mousedown",(e)=>{

    if(drawMode) return;

    dragging = true;

    ox = e.clientX - screenX(obj);
    oy = e.clientY - screenY(obj);

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    obj.x = (e.clientX / cam.zoom) + cam.x - ox / cam.zoom;
    obj.y = (e.clientY / cam.zoom) + cam.y - oy / cam.zoom;

    render();
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* =========================
   WORLD → SCREEN TRANSFORM
   ========================= */

function screenX(obj){
  return (obj.x - cam.x) * cam.zoom;
}

function screenY(obj){
  return (obj.y - cam.y) * cam.zoom;
}

/* RENDER OBJECTS */
function render(){

  for(let o of objects){
    o.el.style.left = screenX(o) + "px";
    o.el.style.top = screenY(o) + "px";
    o.el.style.transform = `scale(${cam.zoom})`;
  }
}

/* =========================
   CAMERA MOVE
   ========================= */

let draggingCam = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  if(drawMode) return;

  draggingCam = true;
  last.x = e.clientX;
  last.y = e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{

  if(!draggingCam) return;

  cam.x -= (e.clientX - last.x) / cam.zoom;
  cam.y -= (e.clientY - last.y) / cam.zoom;

  last.x = e.clientX;
  last.y = e.clientY;

  render();
});

canvas.addEventListener("mouseup",()=>{
  draggingCam = false;
});

/* =========================
   ZOOM (FIXED WORLD LOGIC)
   ========================= */

canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  const mx = e.clientX;
  const my = e.clientY;

  const wx = cam.x + mx / cam.zoom;
  const wy = cam.y + my / cam.zoom;

  cam.zoom *= (e.deltaY < 0) ? 1.1 : 0.9;
  cam.zoom = Math.max(0.2, Math.min(5, cam.zoom));

  cam.x = wx - mx / cam.zoom;
  cam.y = wy - my / cam.zoom;

  render();

},{passive:false});

</script>

</body>
</html>
