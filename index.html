<!DOCTYPE html>
<html>
<head>
<title>Canvas With Draw Tools</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CANVAS */
canvas {
  position:fixed;
  top:0;
  left:0;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:99999;
}

#plus, #drawBtn {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:18px;
  cursor:pointer;
  margin:5px;
}

/* DRAW TOOL PANEL */
#drawPanel {
  display:none;
  margin-top:10px;
  background:white;
  border-radius:10px;
  border:1px solid #ccc;
  padding:10px;
}

select {
  width:100%;
  margin-bottom:5px;
}

/* OBJECTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:grab;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- UI -->
<div id="ui">

  <button id="plus">+</button>
  <button id="drawBtn">✏️</button>

  <div id="drawPanel">
    <select id="color">
      <option value="black">Black</option>
      <option value="red">Red</option>
      <option value="green">Green</option>
    </select>

    <select id="size">
      <option value="2">Small</option>
      <option value="5">Medium</option>
      <option value="10">Large</option>
    </select>
  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* DRAW SETTINGS */
let drawMode = false;
let drawing = false;

let brushColor = "black";
let brushSize = 2;

/* UI */
const panel = document.getElementById("drawPanel");

document.getElementById("drawBtn").onclick = () => {
  drawMode = !drawMode;
  panel.style.display = drawMode ? "block" : "none";
};

/* COLOR + SIZE */
document.getElementById("color").onchange = (e)=>{
  brushColor = e.target.value;
};

document.getElementById("size").onchange = (e)=>{
  brushSize = parseInt(e.target.value);
};

/* OBJECTS (TEXT + VIDEO) */
function addText(){
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";
  el.style.left = "200px";
  el.style.top = "200px";
  enableDrag(el);
  document.body.appendChild(el);
}

function addYT(){
  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";
  el.style.left = "300px";
  el.style.top = "300px";
  el.style.padding = "0";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  enableDrag(el);
  document.body.appendChild(el);
}

/* DRAG SYSTEM */
function enableDrag(el){

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  el.addEventListener("mousedown",(e)=>{

    dragging = true;

    offsetX = e.clientX - el.offsetLeft;
    offsetY = e.clientY - el.offsetTop;

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    el.style.left = (e.clientX - offsetX) + "px";
    el.style.top = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* DRAWING (FIXED PROPERLY) */
canvas.addEventListener("mousemove",(e)=>{

  if(!drawMode || !e.buttons) return;

  ctx.fillStyle = brushColor;

  ctx.beginPath();
  ctx.arc(e.clientX, e.clientY, brushSize, 0, Math.PI * 2);
  ctx.fill();
});

/* SIMPLE CLICK ADD DRAW START */
canvas.addEventListener("mousedown",(e)=>{
  if(!drawMode) return;
});

</script>

</body>
</html>
