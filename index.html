<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* WORLD LAYER */
#world {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
}

/* DRAW CANVAS */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:99999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border-radius:10px;
  border:1px solid #ccc;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<!-- WORLD -->
<div id="world"></div>

<!-- DRAW -->
<canvas id="canvas"></canvas>

<!-- UI -->
<div id="ui">
  <button id="plus">+</button>

  <div id="menu">
    <div class="item" onclick="addText()">Add Text</div>
    <div class="item" onclick="addYT()">Add YouTube</div>
    <div class="item" onclick="toggleDraw()">Draw Mode</div>

    <hr>

    <div class="item">
      Color:
      <select id="color">
        <option value="black">Black</option>
        <option value="red">Red</option>
        <option value="green">Green</option>
      </select>
    </div>

    <div class="item">
      Size:
      <select id="size">
        <option value="2">Small</option>
        <option value="5">Medium</option>
        <option value="10">Large</option>
      </select>
    </div>
  </div>
</div>

<script>

const world = document.getElementById("world");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

function applyCamera(){
  world.style.transform =
    `translate(${cam.x}px,${cam.y}px) scale(${cam.zoom})`;
}

/* UI */
const menu = document.getElementById("menu");

document.getElementById("plus").onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* DRAW SETTINGS */
let drawMode = false;
let color = "black";
let size = 2;

document.getElementById("color").onchange = e=>{
  color = e.target.value;
};

document.getElementById("size").onchange = e=>{
  size = +e.target.value;
};

function toggleDraw(){
  drawMode = !drawMode;
}

/* TEXT */
function addText(){

  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";

  el.style.left = "400px";
  el.style.top = "400px";

  makeDraggable(el);

  world.appendChild(el);
}

/* YOUTUBE */
function addYT(){

  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";

  el.style.left = "500px";
  el.style.top = "500px";
  el.style.padding = "0";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  makeDraggable(el);

  world.appendChild(el);
}

/* DRAG SYSTEM (FIXED) */
function makeDraggable(el){

  let dragging = false;
  let ox = 0;
  let oy = 0;

  el.addEventListener("mousedown",(e)=>{

    if(el.isContentEditable) return;

    dragging = true;

    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    el.style.left = (e.clientX - ox) + "px";
    el.style.top = (e.clientY - oy) + "px";
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* PAN */
let draggingCam = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  draggingCam = true;
  last.x = e.clientX;
  last.y = e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{

  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;

  last.x = e.clientX;
  last.y = e.clientY;

  if(draggingCam){
    cam.x += dx;
    cam.y += dy;
    applyCamera();
  }

  if(drawMode && e.buttons){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(e.clientX, e.clientY, size, 0, Math.PI*2);
    ctx.fill();
  }
});

canvas.addEventListener("mouseup",()=>{
  draggingCam = false;
});

/* ZOOM (FIXED WORLD ZOOM) */
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  const mx = e.clientX;
  const my = e.clientY;

  const wx = (mx - cam.x) / cam.zoom;
  const wy = (my - cam.y) / cam.zoom;

  cam.zoom *= (e.deltaY < 0) ? 1.1 : 0.9;
  cam.zoom = Math.max(0.2, Math.min(6, cam.zoom));

  cam.x = mx - wx * cam.zoom;
  cam.y = my - wy * cam.zoom;

  applyCamera();

},{passive:false});

</script>

</body>
</html>
