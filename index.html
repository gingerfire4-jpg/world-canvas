<!DOCTYPE html>
<html>
<head>
<title>World Canvas Rebuild</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* WORLD CONTAINER */
#world {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
}

/* CANVAS (DRAW LAYER) */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:99999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border-radius:10px;
  border:1px solid #ccc;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<!-- WORLD -->
<div id="world"></div>

<!-- DRAW -->
<canvas id="canvas"></canvas>

<!-- UI -->
<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">Text</div>
    <div class="item" onclick="addYT()">YouTube</div>
    <div class="item" onclick="toggleDraw()">Draw</div>
  </div>
</div>

<script>

const world = document.getElementById("world");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* CAMERA */
let cam = {
  x:0,
  y:0,
  zoom:1
};

/* UI */
const menu = document.getElementById("menu");

document.getElementById("plus").onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* DRAW MODE */
let drawMode = false;

function toggleDraw(){
  drawMode = !drawMode;
}

/* WORLD OBJECTS */
function addText(){

  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";

  el.dataset.x = cam.x;
  el.dataset.y = cam.y;

  world.appendChild(el);
  makeDraggable(el);
}

function addYT(){

  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";
  el.style.padding = "0";

  el.dataset.x = cam.x;
  el.dataset.y = cam.y;

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  world.appendChild(el);
  makeDraggable(el);
}

/* DRAG (WORLD COORDS FIXED) */
function makeDraggable(el){

  let dragging = false;
  let ox = 0;
  let oy = 0;

  el.addEventListener("mousedown",(e)=>{

    dragging = true;

    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    el.style.left = (e.clientX - ox) + "px";
    el.style.top = (e.clientY - oy) + "px";
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* PAN */
let dragging = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  dragging = true;
  last.x = e.clientX;
  last.y = e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{

  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;

  last.x = e.clientX;
  last.y = e.clientY;

  if(dragging){
    cam.x += dx;
    cam.y += dy;

    world.style.transform =
      `translate(${cam.x}px,${cam.y}px) scale(${cam.zoom})`;
  }

  if(drawMode && e.buttons){
    ctx.fillStyle = "black";
    ctx.fillRect(e.clientX, e.clientY, 2, 2);
  }
});

/* ZOOM (FIXED PROPERLY) */
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  const zoomFactor = 1.1;

  const mx = e.clientX;
  const my = e.clientY;

  const wx = (mx - cam.x) / cam.zoom;
  const wy = (my - cam.y) / cam.zoom;

  cam.zoom *= (e.deltaY < 0) ? zoomFactor : 1/zoomFactor;
  cam.zoom = Math.max(0.2, Math.min(6, cam.zoom));

  cam.x = mx - wx * cam.zoom;
  cam.y = my - wy * cam.zoom;

  world.style.transform =
    `translate(${cam.x}px,${cam.y}px) scale(${cam.zoom})`;

},{passive:false});

</script>

</body>
</html>
