<!DOCTYPE html>
<html>
<head>
<title>World Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* WORLD */
#world {
  position:absolute;
  width:20000px;
  height:20000px;
  background:#f3f3f3;
  transform-origin:0 0;
}

/* RULES */
#rules {
  position:fixed;
  top:20px;
  left:20px;
  background:#0b1b3a;
  color:white;
  padding:15px;
  border-radius:10px;
  z-index:1000;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;
}

#plus {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:grab;
}

iframe {
  position:absolute;
  width:320px;
  height:200px;
  border:none;
  cursor:grab;
}

canvas.draw {
  position:absolute;
}
</style>
</head>

<body>

<div id="world"></div>

<div id="rules">
  <h3>Rules Hub</h3>
  <p>Drag to move</p>
  <p>Scroll to zoom</p>
</div>

<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="createText()">🔤 Text</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>
    <div class="item" onclick="createYT()">📺 YouTube</div>
  </div>
</div>

<script>
const world = document.getElementById("world");

/* CAMERA */
let x = 0;
let y = 0;
let scale = 1;

function update() {
  world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}

/* MENU */
const plus = document.getElementById("plus");
const menu = document.getElementById("menu");

plus.onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* DRAG SYSTEM */
let dragEl = null;
let draggingWorld = false;
let lastX = 0;
let lastY = 0;

document.addEventListener("mousedown", (e) => {
  if (drawMode) return;

  if (e.target.classList.contains("node") || e.target.tagName === "IFRAME") {
    dragEl = e.target;
  } else {
    draggingWorld = true;
  }

  lastX = e.clientX;
  lastY = e.clientY;
});

document.addEventListener("mousemove", (e) => {
  let dx = e.clientX - lastX;
  let dy = e.clientY - lastY;

  if (dragEl) {
    dragEl.style.left = (parseFloat(dragEl.style.left || 0) + dx) + "px";
    dragEl.style.top  = (parseFloat(dragEl.style.top || 0) + dy) + "px";
  }

  if (draggingWorld) {
    x += dx;
    y += dy;
    update();
  }

  lastX = e.clientX;
  lastY = e.clientY;
});

document.addEventListener("mouseup", () => {
  dragEl = null;
  draggingWorld = false;
});

/* ZOOM */
document.addEventListener("wheel", (e) => {
  e.preventDefault();

  let zoom = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= zoom;
  scale = Math.max(0.2, Math.min(4, scale));

  update();
}, { passive:false });

/* TEXT */
function createText() {
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Drag me";
  el.style.left = "300px";
  el.style.top = "300px";
  world.appendChild(el);
}

/* YOUTUBE */
function createYT() {
  let url = prompt("Paste YouTube link:");
  if (!url) return;

  let id;

  if (url.includes("v=")) {
    id = url.split("v=")[1].split("&")[0];
  } else if (url.includes("youtu.be/")) {
    id = url.split("youtu.be/")[1];
  }

  if (!id) {
    alert("Invalid link");
    return;
  }

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;
  iframe.style.left = "400px";
  iframe.style.top = "300px";

  world.appendChild(iframe);
}

/* DRAW (WORLD-BASED) */
let drawMode = false;
let drawing = false;
let currentCanvas = null;
let ctx = null;

function toggleDraw() {
  drawMode = !drawMode;
  alert("Draw: " + (drawMode ? "ON" : "OFF"));
}

document.addEventListener("mousedown", (e) => {
  if (!drawMode) return;

  const rect = world.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  currentCanvas = document.createElement("canvas");
  currentCanvas.width = 400;
  currentCanvas.height = 400;
  currentCanvas.className = "draw";

  currentCanvas.style.left = x + "px";
  currentCanvas.style.top = y + "px";

  world.appendChild(currentCanvas);

  ctx = currentCanvas.getContext("2d");
  drawing = true;
});

document.addEventListener("mousemove", (e) => {
  if (!drawing || !ctx) return;

  const rect = currentCanvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  ctx.fillRect(x, y, 3, 3);
});

document.addEventListener("mouseup", () => {
  drawing = false;
  currentCanvas = null;
  ctx = null;
});
</script>

</body>
</html>
