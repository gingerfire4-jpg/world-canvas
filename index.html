<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas RESTORED</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* DRAW LAYER */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* WORLD */
#world {
  position:absolute;
  top:0;
  left:0;
  z-index:2;
}

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
  user-select:none;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
}

#menu {
  display:none;
  background:white;
  border:1px solid #ccc;
  border-radius:10px;
  margin-top:10px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* RULES */
#rules {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  border:2px solid black;
  z-index:99999;
}
</style>
</head>

<body>

<!-- RULES -->
<div id="rules">
  <h2>Rules</h2>
  <p>No NSFW content</p>
  <p>No illegal content</p>
  <p>Respect canvas space</p>
  <button onclick="document.getElementById('rules').style.display='none'">
    Enter
  </button>
</div>

<canvas id="canvas"></canvas>
<div id="world"></div>

<div id="ui">
  <button id="plus">+</button>

  <div id="menu">
    <div class="item" onclick="addText()">Text Box</div>
    <div class="item" onclick="addYT()">YouTube</div>
    <div class="item" onclick="toggleDraw()">Draw</div>
  </div>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const world=document.getElementById("world");

canvas.width=innerWidth;
canvas.height=innerHeight;

/* CAMERA */
let cam={x:0,y:0,zoom:1};

/* OBJECTS */
let objects=[];

/* DRAW */
let strokes=[];
let current=[];

/* MENU */
document.getElementById("plus").onclick=()=>{
  let m=document.getElementById("menu");
  m.style.display=m.style.display==="block"?"none":"block";
};

/* =========================
   OBJECTS
   ========================= */

function create(el,x,y){
  let o={el,x,y};
  objects.push(o);
  world.appendChild(el);
  drag(o);
  render();
}

/* TEXT */
function addText(){
  let el=document.createElement("div");
  el.className="node";
  el.contentEditable=true;
  el.innerText="Text";
  create(el,cam.x+200,cam.y+200);
}

/* YOUTUBE */
function addYT(){
  let url=prompt("YouTube URL:");
  if(!url) return;

  let id=url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  let el=document.createElement("div");
  el.className="node";
  el.style.padding="0";

  let iframe=document.createElement("iframe");
  iframe.src="https://www.youtube.com/embed/"+id;

  el.appendChild(iframe);

  create(el,cam.x+200,cam.y+200);
}

/* =========================
   DRAG FIXED
   ========================= */

function drag(obj){

  let down=false,ox=0,oy=0;

  obj.el.addEventListener("mousedown",(e)=>{
    down=true;

    let wx=cam.x+e.clientX/cam.zoom;
    let wy=cam.y+e.clientY/cam.zoom;

    ox=wx-obj.x;
    oy=wy-obj.y;
  });

  document.addEventListener("mousemove",(e)=>{
    if(!down) return;

    let wx=cam.x+e.clientX/cam.zoom;
    let wy=cam.y+e.clientY/cam.zoom;

    obj.x=wx-ox;
    obj.y=wy-oy;

    render();
  });

  document.addEventListener("mouseup",()=>down=false);
}

/* =========================
   RENDER
   ========================= */

function render(){
  for(let o of objects){
    o.el.style.left=(o.x-cam.x)*cam.zoom+"px";
    o.el.style.top=(o.y-cam.y)*cam.zoom+"px";
  }
}

/* =========================
   CAMERA
   ========================= */

let dragCam=false,last={x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  dragCam=true;
  last.x=e.clientX;
  last.y=e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{
  if(!dragCam) return;

  cam.x-=(e.clientX-last.x)/cam.zoom;
  cam.y-=(e.clientY-last.y)/cam.zoom;

  last.x=e.clientX;
  last.y=e.clientY;

  render();
});

canvas.addEventListener("mouseup",()=>dragCam=false);

/* =========================
   ZOOM FIXED
   ========================= */

canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  let mx=e.clientX,my=e.clientY;

  let wx=cam.x+mx/cam.zoom;
  let wy=cam.y+my/cam.zoom;

  cam.zoom*=(e.deltaY<0)?1.1:0.9;
  cam.zoom=Math.max(0.2,Math.min(6,cam.zoom));

  cam.x=wx-mx/cam.zoom;
  cam.y=wy-my/cam.zoom;

  render();

},{passive:false});

/* =========================
   DRAWING (FIXED SIMPLE)
   ========================= */

canvas.addEventListener("mousemove",(e)=>{

  if(!e.buttons) return;

  let x=(e.clientX/cam.zoom)+cam.x;
  let y=(e.clientY/cam.zoom)+cam.y;

  ctx.fillStyle="black";

  ctx.beginPath();
  ctx.arc((x-cam.x)*cam.zoom,(y-cam.y)*cam.zoom,2,0,Math.PI*2);
  ctx.fill();
});

</script>

</body>
</html>
