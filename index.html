<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas FIXED ENGINE</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* DRAW LAYER */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* WORLD OBJECTS */
#world {
  position:absolute;
  top:0;
  left:0;
  z-index:2;
}

.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
  user-select:none;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}

/* RULES */
#rules {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  border:2px solid black;
  z-index:99999;
}
</style>
</head>

<body>

<div id="rules">
  <h2>Rules</h2>
  <p>No illegal content</p>
  <p>No NSFW content</p>
  <p>Respect canvas space</p>
  <button onclick="this.parentElement.style.display='none'">Enter</button>
</div>

<canvas id="canvas"></canvas>
<div id="world"></div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const world = document.getElementById("world");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

/* OBJECTS */
let objects = [];

/* DRAW STORAGE (WORLD SPACE) */
let strokes = [];
let current = null;

/* =========================
   WORLD OBJECTS
   ========================= */

function create(el,x,y){
  let obj = {el,x,y};
  objects.push(obj);
  world.appendChild(el);
  drag(obj);
  render();
}

/* TEXT */
function addText(){
  let el = document.createElement("div");
  el.className="node";
  el.contentEditable=true;
  el.innerText="Text";
  create(el, cam.x+200, cam.y+200);
}

/* YOUTUBE */
function addYT(){
  let url = prompt("YouTube URL:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  let el = document.createElement("div");
  el.className="node";
  el.style.padding="0";

  let iframe=document.createElement("iframe");
  iframe.src="https://www.youtube.com/embed/"+id;

  el.appendChild(iframe);

  create(el, cam.x+200, cam.y+200);
}

/* =========================
   DRAG WORLD OBJECTS
   ========================= */

function drag(obj){

  let down=false, offX=0, offY=0;

  obj.el.addEventListener("mousedown",(e)=>{
    down=true;

    let wx = cam.x + e.clientX/cam.zoom;
    let wy = cam.y + e.clientY/cam.zoom;

    offX = wx - obj.x;
    offY = wy - obj.y;
  });

  document.addEventListener("mousemove",(e)=>{
    if(!down) return;

    let wx = cam.x + e.clientX/cam.zoom;
    let wy = cam.y + e.clientY/cam.zoom;

    obj.x = wx - offX;
    obj.y = wy - offY;

    render();
  });

  document.addEventListener("mouseup",()=>down=false);
}

/* =========================
   RENDER WORLD OBJECTS
   ========================= */

function render(){

  for(let o of objects){
    o.el.style.left = (o.x - cam.x) * cam.zoom + "px";
    o.el.style.top  = (o.y - cam.y) * cam.zoom + "px";
  }
}

/* =========================
   CAMERA MOVE
   ========================= */

let dragging=false,last={x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  dragging=true;
  last.x=e.clientX;
  last.y=e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{
  if(!dragging) return;

  cam.x -= (e.clientX-last.x)/cam.zoom;
  cam.y -= (e.clientY-last.y)/cam.zoom;

  last.x=e.clientX;
  last.y=e.clientY;

  render();
});

canvas.addEventListener("mouseup",()=>dragging=false);

/* =========================
   ZOOM FIXED
   ========================= */

canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  let mx=e.clientX,my=e.clientY;

  let wx=cam.x+mx/cam.zoom;
  let wy=cam.y+my/cam.zoom;

  cam.zoom*=(e.deltaY<0)?1.1:0.9;
  cam.zoom=Math.max(0.2,Math.min(6,cam.zoom));

  cam.x=wx-mx/cam.zoom;
  cam.y=wy-my/cam.zoom;

  render();

},{passive:false});

/* =========================
   DRAWING (FIXED WORLD SPACE)
   ========================= */

canvas.addEventListener("mousedown",(e)=>{
  current=[];
  strokes.push(current);
});

canvas.addEventListener("mousemove",(e)=>{
  if(!e.buttons) return;

  let x=cam.x+e.clientX/cam.zoom;
  let y=cam.y+e.clientY/cam.zoom;

  current.push({x,y});

  draw();
});

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="black";

  for(let s of strokes){
    for(let p of s){

      ctx.beginPath();
      ctx.arc(
        (p.x-cam.x)*cam.zoom,
        (p.y-cam.y)*cam.zoom,
        2,0,Math.PI*2
      );
      ctx.fill();
    }
  }
}

</script>

</body>
</html>
