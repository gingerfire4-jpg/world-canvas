<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas Fixed Mode System</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* DRAW LAYER */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* WORLD OBJECTS */
#world {
  position:absolute;
  top:0;
  left:0;
  z-index:2;
}

.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  user-select:none;
  cursor:pointer;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
}

#menu {
  display:none;
  background:white;
  border:1px solid #ccc;
  border-radius:10px;
  margin-top:10px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="world"></div>

<div id="ui">
  <button id="plus">+</button>

  <div id="menu">
    <div class="item" onclick="addText()">T</div>
    <div class="item" onclick="addYT()">📺</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>

    <hr>

    <div class="item">
      Color:
      <select id="color">
        <option value="black">Black</option>
        <option value="red">Red</option>
        <option value="green">Green</option>
      </select>
    </div>

    <div class="item">
      Brush:
      <select id="size">
        <option value="2">Small</option>
        <option value="5">Medium</option>
        <option value="10">Large</option>
      </select>
    </div>
  </div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const world = document.getElementById("world");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

/* OBJECTS */
let objects = [];

/* DRAW */
let drawMode = false;
let brushColor = "black";
let brushSize = 2;

/* EDIT MODE SYSTEM */
let activeObject = null;

/* UI */
document.getElementById("plus").onclick = ()=>{
  const m = document.getElementById("menu");
  m.style.display = m.style.display === "block" ? "none" : "block";
};

document.getElementById("color").onchange = e=>{
  brushColor = e.target.value;
};

document.getElementById("size").onchange = e=>{
  brushSize = +e.target.value;
};

function toggleDraw(){
  drawMode = !drawMode;
  activeObject = null;
}

/* =========================
   OBJECT SYSTEM
   ========================= */

function createObject(el, x, y){

  const obj = { el, x, y };

  objects.push(obj);
  world.appendChild(el);

  enableSelectAndMove(obj);

  render();
}

/* TEXT */
function addText(){

  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";

  createObject(el, cam.x + 200, cam.y + 200);
}

/* YOUTUBE */
function addYT(){

  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";
  el.style.padding = "0";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  createObject(el, cam.x + 200, cam.y + 200);
}

/* =========================
   CLICK TO MOVE (EDIT MODE)
   ========================= */

function enableSelectAndMove(obj){

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  obj.el.addEventListener("mousedown",(e)=>{

    if(drawMode) return;

    activeObject = obj;
    dragging = true;

    const wx = cam.x + e.clientX / cam.zoom;
    const wy = cam.y + e.clientY / cam.zoom;

    offsetX = wx - obj.x;
    offsetY = wy - obj.y;

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging || obj !== activeObject) return;

    const wx = cam.x + e.clientX / cam.zoom;
    const wy = cam.y + e.clientY / cam.zoom;

    obj.x = wx - offsetX;
    obj.y = wy - offsetY;

    render();
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* =========================
   RENDER WORLD OBJECTS
   ========================= */

function render(){

  for(let o of objects){

    o.el.style.left = (o.x - cam.x) * cam.zoom + "px";
    o.el.style.top  = (o.y - cam.y) * cam.zoom + "px";

  }
}

/* =========================
   CAMERA PAN
   ========================= */

let draggingCam = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{

  if(drawMode) return;

  activeObject = null;
  draggingCam = true;

  last.x = e.clientX;
  last.y = e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{

  if(!draggingCam) return;

  cam.x -= (e.clientX - last.x) / cam.zoom;
  cam.y -= (e.clientY - last.y) / cam.zoom;

  last.x = e.clientX;
  last.y = e.clientY;

  render();
});

canvas.addEventListener("mouseup",()=>{
  draggingCam = false;
});

/* =========================
   ZOOM (FIXED)
   ========================= */

canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  const mx = e.clientX;
  const my = e.clientY;

  const wx = cam.x + mx / cam.zoom;
  const wy = cam.y + my / cam.zoom;

  cam.zoom *= (e.deltaY < 0) ? 1.1 : 0.9;
  cam.zoom = Math.max(0.2, Math.min(6, cam.zoom));

  cam.x = wx - mx / cam.zoom;
  cam.y = wy - my / cam.zoom;

  render();

},{passive:false});

/* =========================
   DRAWING (ZOOM AWARE)
   ========================= */

canvas.addEventListener("mousemove",(e)=>{

  if(!drawMode || !e.buttons) return;

  ctx.fillStyle = brushColor;

  const x = (e.clientX / cam.zoom) + cam.x;
  const y = (e.clientY / cam.zoom) + cam.y;

  ctx.beginPath();
  ctx.arc(
    (x - cam.x) * cam.zoom,
    (y - cam.y) * cam.zoom,
    brushSize,
    0,
    Math.PI * 2
  );
  ctx.fill();
});

</script>

</body>
</html>
