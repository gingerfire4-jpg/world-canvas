<!DOCTYPE html>
<html>
<head>
<title>World Canvas</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

/* WORLD */
#world {
  position: absolute;
  width: 10000px;
  height: 10000px;
  transform-origin: 0 0;
}

/* RULES (PINNED) */
#rules {
  position: fixed;
  left: 20px;
  top: 20px;
  width: 260px;
  padding: 15px;
  border-radius: 14px;
  background: #0b1b3a;
  color: white;
  z-index: 9999;
}

/* UI */
#ui {
  position: fixed;
  top: 20px;
  right: 20px;
}

#plus {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: none;
  background: #0b1b3a;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

#menu {
  display: none;
  margin-top: 10px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 10px;
}

.item {
  padding: 10px;
  cursor: pointer;
}
.item:hover { background: #eee; }

/* TRENDING */
#trending {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 220px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 10px;
}

/* OBJECTS */
.node {
  position: absolute;
  min-width: 120px;
  padding: 8px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 8px;
  cursor: move;
}

/* YOUTUBE */
iframe {
  position: absolute;
  width: 300px;
  height: 200px;
  border: none;
  cursor: move;
}

/* DRAW */
canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="world"></div>

<!-- RULES -->
<div id="rules">
  <h3>Rules Hub</h3>
  <p>Spawn point</p>
</div>

<!-- UI -->
<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">🔤 Text</div>
    <div class="item" onclick="enableDraw()">🎨 Draw</div>
    <div class="item" onclick="addYouTube()">📺 YouTube</div>
  </div>
</div>

<!-- TRENDING -->
<div id="trending">
  <b>🔥 Trending</b>
  <div id="list"></div>
</div>

<canvas id="draw"></canvas>

<script>
let world = document.getElementById("world");
let canvas = document.getElementById("draw");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let offsetX = 0, offsetY = 0, scale = 1;
let draggingWorld = false;
let dragTarget = null;

let drawMode = false;

/* MENU */
document.getElementById("plus").onclick = () => {
  let m = document.getElementById("menu");
  m.style.display = m.style.display === "block" ? "none" : "block";
};

/* DRAG ELEMENT */
function makeDraggable(el) {
  el.addEventListener("mousedown", (e) => {
    dragTarget = el;
    e.stopPropagation();
  });
}

/* TEXT */
function addText() {
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Edit me";
  el.style.left = "400px";
  el.style.top = "300px";
  world.appendChild(el);
  makeDraggable(el);
}

/* YOUTUBE */
function addYouTube() {
  let url = prompt("Paste YouTube link:");
  if (!url) return;

  let id = url.split("v=")[1];
  if (!id) return alert("Invalid link");

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;
  iframe.style.left = "500px";
  iframe.style.top = "300px";

  world.appendChild(iframe);
  makeDraggable(iframe);
}

/* DRAW */
function enableDraw() {
  drawMode = !drawMode;
  canvas.style.pointerEvents = drawMode ? "auto" : "none";
}

let drawing = false;

canvas.addEventListener("mousedown", () => {
  if (!drawMode) return;
  drawing = true;
});

canvas.addEventListener("mouseup", () => drawing = false);

canvas.addEventListener("mousemove", (e) => {
  if (!drawing) return;
  ctx.fillRect(e.clientX, e.clientY, 2, 2);
});

/* WORLD PAN */
document.addEventListener("mousedown", () => draggingWorld = true);
document.addEventListener("mouseup", () => {
  draggingWorld = false;
  dragTarget = null;
});

document.addEventListener("mousemove", (e) => {
  if (dragTarget) {
    dragTarget.style.left =
      (parseFloat(dragTarget.style.left) + e.movementX) + "px";
    dragTarget.style.top =
      (parseFloat(dragTarget.style.top) + e.movementY) + "px";
    return;
  }

  if (draggingWorld && !drawMode) {
    offsetX += e.movementX;
    offsetY += e.movementY;
    update();
  }
});

/* ZOOM */
document.addEventListener("wheel", (e) => {
  e.preventDefault();
  scale -= e.deltaY * 0.001;
  scale = Math.max(0.3, Math.min(3, scale));
  update();
}, { passive:false });

function update() {
  world.style.transform =
    `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}
</script>

</body>
</html>
