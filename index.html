<!DOCTYPE html>
<html>
<head>
<title>Fixed Infinite Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CAMERA */
#camera {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
}

/* CANVAS BACKGROUND */
canvas {
  display:block;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:99999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:24px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border-radius:10px;
  border:1px solid #ccc;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
}

.node[contenteditable="true"] {
  cursor:text;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- UI -->
<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">🔤 Text</div>
    <div class="item" onclick="addYT()">📺 YouTube</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>
  </div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

/* OBJECTS */
let objects = [];

/* UI MENU */
const menu = document.getElementById("menu");
document.getElementById("plus").onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* TEXT */
function addText(){
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Type here...";
  el.style.left = "400px";
  el.style.top = "400px";

  makeDraggable(el);

  document.body.appendChild(el);
}

/* YOUTUBE (REAL VIDEO FIX) */
function addYT(){
  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";
  el.style.left = "500px";
  el.style.top = "500px";
  el.style.padding = "0";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  makeDraggable(el);

  document.body.appendChild(el);
}

/* DRAG SYSTEM (FIXED) */
function makeDraggable(el){

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  el.addEventListener("mousedown",(e)=>{

    if(el.isContentEditable) return; // allow typing

    dragging = true;

    offsetX = e.clientX - el.offsetLeft;
    offsetY = e.clientY - el.offsetTop;

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    el.style.left = (e.clientX - offsetX) + "px";
    el.style.top = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* DRAW MODE */
let drawMode = false;
let drawing = false;

function toggleDraw(){
  drawMode = !drawMode;
}

/* CAMERA PAN */
let draggingCam = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  draggingCam = true;
  last.x = e.clientX;
  last.y = e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{

  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;

  last.x = e.clientX;
  last.y = e.clientY;

  if(draggingCam){
    cam.x -= dx;
    cam.y -= dy;
  }
});

/* ZOOM */
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  let zoom = e.deltaY > 0 ? 0.9 : 1.1;
  cam.zoom *= zoom;
  cam.zoom = Math.max(0.3, Math.min(5, cam.zoom));

},{passive:false});

/* DRAW */
canvas.addEventListener("mousemove",(e)=>{

  if(!drawMode || !draggingCam) return;

  ctx.fillStyle="black";
  ctx.fillRect(e.clientX, e.clientY, 3, 3);
});

/* RENDER LOOP (optional future extension) */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
