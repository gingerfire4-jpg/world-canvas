<!DOCTYPE html>
<html>
<head>
<title>World Canvas CLEAN ENGINE</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CAMERA LAYER */
#camera {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
}

/* WORLD */
#world {
  position:relative;
  width:20000px;
  height:20000px;
  background:#f4f4f4;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:grab;
}

iframe {
  position:absolute;
  width:320px;
  height:200px;
  border:none;
  cursor:grab;
}

canvas.draw {
  position:absolute;
}
</style>
</head>

<body>

<div id="camera">
  <div id="world"></div>
</div>

<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">🔤 Text</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>
    <div class="item" onclick="addYT()">📺 YouTube</div>
  </div>
</div>

<script>
const camera = document.getElementById("camera");
const world = document.getElementById("world");

/* CAMERA */
let camX = 0;
let camY = 0;
let scale = 1;

/* APPLY CAMERA */
function renderCamera(){
  camera.style.transform =
    `translate(${camX}px,${camY}px) scale(${scale})`;
}

/* MENU */
const menu = document.getElementById("menu");
document.getElementById("plus").onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* PAN SYSTEM (FIXED) */
let dragging = false;
let lastX = 0;
let lastY = 0;

document.addEventListener("mousedown",(e)=>{
  if(e.target.closest(".node") || e.target.tagName==="IFRAME") return;

  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

document.addEventListener("mousemove",(e)=>{
  if(!dragging) return;

  camX += e.clientX - lastX;
  camY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;

  renderCamera();
});

document.addEventListener("mouseup",()=>dragging=false);

/* ZOOM (FIXED) */
document.addEventListener("wheel",(e)=>{
  e.preventDefault();

  let old = scale;
  scale += e.deltaY * -0.001;
  scale = Math.max(0.2, Math.min(4, scale));

  renderCamera();
},{passive:false});

/* TEXT */
function addText(){
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Drag me";
  el.style.left = "500px";
  el.style.top = "500px";

  world.appendChild(el);
}

/* YOUTUBE */
function addYT(){
  let url = prompt("Paste YouTube link:");
  if(!url) return;

  let id;

  if(url.includes("v=")){
    id = url.split("v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1];
  }

  if(!id) return alert("Invalid link");

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;
  iframe.style.left = "600px";
  iframe.style.top = "600px";

  world.appendChild(iframe);
}

/* DRAW (WORLD-BASED) */
let drawMode = false;
let drawing = false;
let canvas = null;
let ctx = null;

function toggleDraw(){
  drawMode = !drawMode;
  alert("Draw: " + (drawMode ? "ON" : "OFF"));
}

document.addEventListener("mousedown",(e)=>{
  if(!drawMode) return;
  if(e.target.closest("#ui")) return;

  canvas = document.createElement("canvas");
  canvas.width = 600;
  canvas.height = 600;
  canvas.className = "draw";

  canvas.style.left = (e.clientX - camX) + "px";
  canvas.style.top  = (e.clientY - camY) + "px";

  ctx = canvas.getContext("2d");
  world.appendChild(canvas);

  drawing = true;
});

document.addEventListener("mousemove",(e)=>{
  if(!drawing || !ctx) return;

  const x = (e.clientX - camX);
  const y = (e.clientY - camY);

  ctx.fillRect(x % 600, y % 600, 3, 3);
});

document.addEventListener("mouseup",()=>{
  drawing = false;
  canvas = null;
  ctx = null;
});
</script>

</body>
</html>
