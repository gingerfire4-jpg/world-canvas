<!DOCTYPE html>
<html>
<head>
<title>World Canvas</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#world {
  position:absolute;
  width:10000px;
  height:10000px;
  transform-origin:0 0;
}

/* RULES */
#rules {
  position:fixed;
  top:20px;
  left:20px;
  background:#0b1b3a;
  color:white;
  padding:15px;
  border-radius:12px;
  z-index:9999;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:10px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:move;
}

iframe {
  position:absolute;
  width:320px;
  height:200px;
  border:none;
  cursor:move;
}

/* DRAW */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:5000;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="world"></div>

<div id="rules">
  <h3>Rules Hub</h3>
  <p>Spawn point</p>
</div>

<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" id="btnText">🔤 Text</div>
    <div class="item" id="btnDraw">🎨 Draw</div>
    <div class="item" id="btnYT">📺 YouTube</div>
  </div>
</div>

<canvas id="draw"></canvas>

<script>
let world = document.getElementById("world");

/* MENU */
const plus = document.getElementById("plus");
const menu = document.getElementById("menu");

plus.onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e)=>{
  if (!menu.contains(e.target) && e.target !== plus) {
    menu.style.display = "none";
  }
});

/* DRAG SYSTEM */
let dragEl = null;

function makeDraggable(el){
  el.addEventListener("mousedown",(e)=>{
    dragEl = el;
    e.stopPropagation();
  });
}

document.addEventListener("mousemove",(e)=>{
  if(dragEl){
    elMove(dragEl, e.movementX, e.movementY);
  }
});

document.addEventListener("mouseup",()=>{
  dragEl = null;
});

function elMove(el, dx, dy){
  el.style.left = (parseFloat(el.style.left)||0) + dx + "px";
  el.style.top  = (parseFloat(el.style.top)||0) + dy + "px";
}

/* TEXT */
document.getElementById("btnText").onclick = ()=>{
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Edit me";
  el.style.left = "400px";
  el.style.top = "300px";
  world.appendChild(el);
  makeDraggable(el);
};

/* YOUTUBE */
document.getElementById("btnYT").onclick = ()=>{
  let url = prompt("Paste YouTube link:");
  if(!url) return;

  let id = null;

  if(url.includes("youtube.com/watch?v=")){
    id = url.split("v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1];
  }

  if(!id){
    alert("Invalid YouTube link");
    return;
  }

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;
  iframe.style.left = "500px";
  iframe.style.top = "300px";

  world.appendChild(iframe);
  makeDraggable(iframe);
};

/* DRAW TOOL */
let canvas = document.getElementById("draw");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let drawMode = false;
let drawing = false;

document.getElementById("btnDraw").onclick = ()=>{
  drawMode = !drawMode;
  canvas.style.pointerEvents = drawMode ? "auto" : "none";
  alert("Draw mode: " + (drawMode ? "ON" : "OFF"));
};

canvas.addEventListener("mousedown",()=>{
  if(drawMode) drawing = true;
});

canvas.addEventListener("mouseup",()=>drawing=false);

canvas.addEventListener("mousemove",(e)=>{
  if(drawing){
    ctx.fillRect(e.clientX, e.clientY, 3, 3);
  }
});

/* PAN + ZOOM */
let offsetX = 0, offsetY = 0, scale = 1;
let draggingWorld = false;

document.addEventListener("mousedown",()=>{
  if(!dragEl && !drawMode) draggingWorld = true;
});

document.addEventListener("mouseup",()=>draggingWorld=false);

document.addEventListener("mousemove",(e)=>{
  if(draggingWorld){
    offsetX += e.movementX;
    offsetY += e.movementY;
    update();
  }
});

document.addEventListener("wheel",(e)=>{
  e.preventDefault();
  scale -= e.deltaY * 0.001;
  scale = Math.max(0.3, Math.min(3, scale));
  update();
},{passive:false});

function update(){
  world.style.transform =
    `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}
</script>

</body>
</html>
