<!DOCTYPE html>
<html>
<head>
<title>Layered Canvas Fix</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* WORLD CONTAINER (OBJECTS ONLY) */
#world {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
  z-index:2;
}

/* DRAW LAYER (BACKGROUND ONLY) */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
}

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  cursor:grab;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<!-- DRAW LAYER -->
<canvas id="canvas"></canvas>

<!-- OBJECT LAYER -->
<div id="world"></div>

<!-- UI -->
<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <button onclick="addText()">Text</button>
    <button onclick="addYT()">YouTube</button>
    <button onclick="toggleDraw()">Draw</button>
  </div>
</div>

<script>

const world = document.getElementById("world");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

function applyCamera(){
  world.style.transform =
    `translate(${cam.x}px,${cam.y}px) scale(${cam.zoom})`;
}

/* UI */
document.getElementById("plus").onclick = () => {
  let m = document.getElementById("menu");
  m.style.display = m.style.display === "block" ? "none" : "block";
};

/* DRAW MODE */
let drawMode = false;
let brushColor = "black";
let brushSize = 3;

function toggleDraw(){
  drawMode = !drawMode;
}

/* =========================
   OBJECTS (TEXT + YOUTUBE)
   ========================= */

function makeDraggable(el){

  let dragging = false;
  let ox = 0;
  let oy = 0;

  el.addEventListener("mousedown",(e)=>{

    // IMPORTANT FIX:
    // only drag objects when NOT drawing
    if(drawMode) return;

    dragging = true;

    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;

    e.stopPropagation();
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    el.style.left = (e.clientX - ox) + "px";
    el.style.top = (e.clientY - oy) + "px";
  });

  document.addEventListener("mouseup",()=>{
    dragging = false;
  });
}

/* TEXT */
function addText(){

  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";

  el.style.left = "400px";
  el.style.top = "400px";

  world.appendChild(el);
  makeDraggable(el);
}

/* YOUTUBE */
function addYT(){

  let url = prompt("YouTube link:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  const el = document.createElement("div");
  el.className = "node";
  el.style.left = "500px";
  el.style.top = "500px";
  el.style.padding = "0";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  el.appendChild(iframe);

  world.appendChild(el);
  makeDraggable(el);
}

/* =========================
   DRAWING (BACKGROUND ONLY)
   ========================= */

canvas.addEventListener("mousemove",(e)=>{

  if(!drawMode || !e.buttons) return;

  ctx.fillStyle = brushColor;
  ctx.beginPath();
  ctx.arc(e.clientX, e.clientY, brushSize, 0, Math.PI*2);
  ctx.fill();
});

/* =========================
   CAMERA MOVEMENT
   ========================= */

let draggingCam = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  if(drawMode) return; // IMPORTANT FIX

  draggingCam = true;
  last.x = e.clientX;
  last.y = e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{

  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;

  last.x = e.clientX;
  last.y = e.clientY;

  if(draggingCam){
    cam.x += dx;
    cam.y += dy;
    applyCamera();
  }
});

canvas.addEventListener("mouseup",()=>{
  draggingCam = false;
});

/* =========================
   ZOOM (FIXED)
   ========================= */

canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  const mx = e.clientX;
  const my = e.clientY;

  const wx = (mx - cam.x) / cam.zoom;
  const wy = (my - cam.y) / cam.zoom;

  cam.zoom *= (e.deltaY < 0) ? 1.1 : 0.9;
  cam.zoom = Math.max(0.2, Math.min(6, cam.zoom));

  cam.x = mx - wx * cam.zoom;
  cam.y = my - wy * cam.zoom;

  applyCamera();

},{passive:false});

</script>

</body>
</html>
