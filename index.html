<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:#1a1a1a;
}

canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
  background:#1a1a1a;
}

#world {
  position:absolute;
  top:0;
  left:0;
  z-index:2;
}

.node {
  position:absolute;
  border-radius:12px;
  padding:12px;
  user-select:none;
  cursor:grab;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  min-width:100px;
  border:2px solid transparent;
  transition:border 0.2s;
  backdrop-filter:blur(2px);
}

.node:hover {
  border-color:rgba(255,255,255,0.3);
  box-shadow:0 6px 20px rgba(0,0,0,0.6);
}

.node.selected {
  border-color:#7c3aed;
  box-shadow:0 0 16px rgba(124,58,237,0.6);
}

.node-controls {
  position:absolute;
  top:-35px;
  right:0;
  display:flex;
  gap:8px;
  background:rgba(20,20,30,0.95);
  padding:6px 8px;
  border-radius:8px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.1);
}

.node:hover .node-controls {
  opacity:1;
  pointer-events:all;
}

.node-btn {
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  width:28px;
  height:28px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  transition:all 0.2s;
}

.node-btn:hover {
  background:rgba(255,255,255,0.2);
  border-color:rgba(255,255,255,0.4);
}

iframe {
  width:320px;
  height:200px;
  border:none;
  border-radius:8px;
  display:block;
}
