<!DOCTYPE html>
<html>
<head>
<title>Infinite World Canvas</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CAMERA */
#camera {
  position:absolute;
  top:0;
  left:0;
  transform-origin:0 0;
}

/* WORLD */
#world {
  position:relative;
  width:20000px;
  height:20000px;
  background:#f5f5f5;
}

/* RULES */
#rules {
  position:fixed;
  background:#0b1b3a;
  color:white;
  padding:20px;
  border-radius:12px;
  z-index:9999;
  text-align:center;
  pointer-events:none; /* IMPORTANT FIX */
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:grab;
}

iframe {
  position:absolute;
  width:320px;
  height:200px;
  border:none;
  cursor:grab;
}

canvas.draw {
  position:absolute;
}
</style>
</head>

<body>

<!-- CAMERA WRAPPER -->
<div id="camera">
  <div id="world"></div>
</div>

<!-- RULES -->
<div id="rules">
  <h3>Rules Hub</h3>
  <p>Drag to move</p>
  <p>Scroll to zoom</p>
</div>

<!-- UI -->
<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="addText()">🔤 Text</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>
    <div class="item" onclick="addYT()">📺 YouTube</div>
  </div>
</div>

<script>
const camera = document.getElementById("camera");
const world = document.getElementById("world");
const rules = document.getElementById("rules");

/* CAMERA */
let camX = 0;
let camY = 0;
let scale = 1;

function render(){
  camera.style.transform =
    `translate(${camX}px,${camY}px) scale(${scale})`;
}

/* CENTER RULES ON START */
window.onload = () => {
  rules.style.left = "50%";
  rules.style.top = "50%";
  rules.style.transform = "translate(-50%, -50%)";
};

/* MENU */
const menu = document.getElementById("menu");

document.getElementById("plus").onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* PAN SYSTEM (FIXED) */
let dragging = false;
let lastX = 0;
let lastY = 0;

document.addEventListener("mousedown",(e)=>{

  // ignore UI + objects
  if(
    e.target.closest("#ui") ||
    e.target.closest(".node") ||
    e.target.tagName==="IFRAME" ||
    e.target.tagName==="CANVAS" ||
    e.target.closest("#rules")
  ) return;

  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

document.addEventListener("mousemove",(e)=>{
  if(!dragging) return;

  camX += e.clientX - lastX;
  camY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;

  render();
});

document.addEventListener("mouseup",()=>dragging=false);

/* ZOOM */
document.addEventListener("wheel",(e)=>{
  e.preventDefault();

  let zoom = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= zoom;
  scale = Math.max(0.2, Math.min(4, scale));

  render();
},{passive:false});

/* TEXT */
function addText(){
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";
  el.style.left = "500px";
  el.style.top = "500px";
  world.appendChild(el);
}

/* YOUTUBE (DRAG FIXED) */
function addYT(){
  let url = prompt("Paste YouTube link:");
  if(!url) return;

  let id;

  if(url.includes("v=")){
    id = url.split("v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1];
  }

  if(!id) return alert("Invalid link");

  const wrapper = document.createElement("div");
  wrapper.className = "node";
  wrapper.style.width = "320px";
  wrapper.style.height = "200px";
  wrapper.style.padding = "0";

  wrapper.style.left = "700px";
  wrapper.style.top = "700px";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + id;

  wrapper.appendChild(iframe);
  world.appendChild(wrapper);
}

/* DRAW (WORLD BASED) */
let drawMode = false;
let drawing = false;
let canvas = null;
let ctx = null;

function toggleDraw(){
  drawMode = !drawMode;
  alert("Draw: " + (drawMode ? "ON" : "OFF"));
}

document.addEventListener("mousedown",(e)=>{
  if(!drawMode) return;
  if(e.target.closest("#ui")) return;

  const wx = (e.clientX - camX) / scale;
  const wy = (e.clientY - camY) / scale;

  canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 1200;
  canvas.className = "draw";

  canvas.style.left = wx + "px";
  canvas.style.top = wy + "px";

  ctx = canvas.getContext("2d");
  world.appendChild(canvas);

  drawing = true;
});

document.addEventListener("mousemove",(e)=>{
  if(!drawing || !ctx) return;

  const wx = (e.clientX - camX) / scale;
  const wy = (e.clientY - camY) / scale;

  ctx.fillRect(wx % 1200, wy % 1200, 3, 3);
});

document.addEventListener("mouseup",()=>{
  drawing = false;
  canvas = null;
  ctx = null;
});
</script>

</body>
</html>
