<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas FIXED</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

/* CANVAS (DRAW LAYER) */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* WORLD OBJECTS */
#world {
  position:absolute;
  top:0;
  left:0;
  z-index:2;
}

/* OBJECTS */
.node {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  user-select:none;
  cursor:grab;
}

iframe {
  width:320px;
  height:200px;
  border:none;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

#plus {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
}

/* RULES OVERLAY */
#rules {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  border:2px solid #000;
  z-index:99999;
  width:300px;
  text-align:center;
}
</style>
</head>

<body>

<!-- RULES (FIXED CENTER POPUP) -->
<div id="rules">
  <h2>Rules</h2>
  <p>No nude content</p>
  <p>No illegal content</p>
  <p>Respect the canvas space</p>
  <button onclick="document.getElementById('rules').style.display='none'">
    Enter
  </button>
</div>

<canvas id="canvas"></canvas>
<div id="world"></div>

<div id="ui">
  <button id="plus">+</button>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const world = document.getElementById("world");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* CAMERA */
let cam = { x:0, y:0, zoom:1 };

/* OBJECTS */
let objects = [];

/* DRAWING DATA (FIXED WORLD STORAGE) */
let strokes = [];
let currentStroke = null;

/* =========================
   OBJECT CREATION
   ========================= */

function createObject(el,x,y){
  let obj = { el, x, y };
  objects.push(obj);
  world.appendChild(el);
  drag(obj);
  render();
}

/* TEXT */
function addText(){
  let el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Text";
  createObject(el, cam.x+200, cam.y+200);
}

/* YOUTUBE */
function addYT(){
  let url = prompt("YouTube URL:");
  if(!url) return;

  let id = url.includes("v=")
    ? url.split("v=")[1].split("&")[0]
    : url.split("youtu.be/")[1];

  let el = document.createElement("div");
  el.className = "node";
  el.style.padding="0";

  let iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/"+id;

  el.appendChild(iframe);

  createObject(el, cam.x+200, cam.y+200);
}

/* =========================
   DRAG FIX (WORLD SPACE)
   ========================= */

function drag(obj){

  let down=false, offX=0, offY=0;

  obj.el.addEventListener("mousedown",(e)=>{

    down=true;

    let wx = cam.x + e.clientX/cam.zoom;
    let wy = cam.y + e.clientY/cam.zoom;

    offX = wx - obj.x;
    offY = wy - obj.y;
  });

  document.addEventListener("mousemove",(e)=>{
    if(!down) return;

    let wx = cam.x + e.clientX/cam.zoom;
    let wy = cam.y + e.clientY/cam.zoom;

    obj.x = wx - offX;
    obj.y = wy - offY;

    render();
  });

  document.addEventListener("mouseup",()=>down=false);
}

/* =========================
   RENDER OBJECTS
   ========================= */

function render(){

  for(let o of objects){
    o.el.style.left = (o.x - cam.x) * cam.zoom + "px";
    o.el.style.top  = (o.y - cam.y) * cam.zoom + "px";
  }
}

/* =========================
   CAMERA MOVE
   ========================= */

let dragCam=false,last={x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
  dragCam=true;
  last.x=e.clientX;
  last.y=e.clientY;
});

canvas.addEventListener("mousemove",(e)=>{
  if(!dragCam) return;

  cam.x -= (e.clientX-last.x)/cam.zoom;
  cam.y -= (e.clientY-last.y)/cam.zoom;

  last.x=e.clientX;
  last.y=e.clientY;

  render();
});

canvas.addEventListener("mouseup",()=>dragCam=false);

/* =========================
   ZOOM (FIXED)
   ========================= */

canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();

  let mx=e.clientX,my=e.clientY;

  let wx = cam.x + mx/cam.zoom;
  let wy = cam.y + my/cam.zoom;

  cam.zoom *= (e.deltaY<0)?1.1:0.9;
  cam.zoom=Math.max(0.2,Math.min(6,cam.zoom));

  cam.x = wx - mx/cam.zoom;
  cam.y = wy - my/cam.zoom;

  render();

},{passive:false});

/* =========================
   DRAWING (WORLD LOCKED FIX)
   ========================= */

canvas.addEventListener("mousedown",(e)=>{
  currentStroke = [];
  strokes.push(currentStroke);
});

canvas.addEventListener("mousemove",(e)=>{

  if(!e.buttons) return;

  let x = cam.x + e.clientX/cam.zoom;
  let y = cam.y + e.clientY/cam.zoom;

  currentStroke.push({x,y});

  drawAll();
});

/* REDRAW ALL STROKES */
function drawAll(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="black";

  for(let s of strokes){

    for(let p of s){

      ctx.beginPath();
      ctx.arc(
        (p.x - cam.x)*cam.zoom,
        (p.y - cam.y)*cam.zoom,
        2,
        0,Math.PI*2
      );
      ctx.fill();
    }
  }
}

</script>

</body>
</html>
