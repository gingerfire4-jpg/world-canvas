<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Canvas - Pro Edition</title>
  <style>
    :root {
      --primary: #7c3aed;
      --primary-hover: #8b5cf6;
      --bg-dark: #1a1a1a;
      --panel-bg: rgba(20, 20, 30, 0.95);
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: white;
    }

    /* Main Canvas & World */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      background: var(--bg-dark);
      cursor: crosshair;
    }

    #world {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none; /* Allows clicking through to canvas for panning */
    }

    /* Nodes (Text, YT, Weather) */
    .node {
      position: absolute;
      border-radius: 12px;
      padding: 12px;
      user-select: none;
      cursor: grab;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      min-width: 100px;
      border: 2px solid transparent;
      transition: border 0.2s;
      backdrop-filter: blur(4px);
      pointer-events: auto; /* Re-enable events for the nodes themselves */
    }

    .node:hover { border-color: rgba(255,255,255,0.3); }
    .node.selected { border-color: var(--primary); box-shadow: 0 0 16px rgba(124,58,237,0.6); }

    .node-controls {
      position: absolute;
      top: -40px;
      right: 0;
      display: flex;
      gap: 8px;
      background: var(--panel-bg);
      padding: 6px 8px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .node:hover .node-controls { opacity: 1; }

    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--primary);
      bottom: 0;
      right: 0;
      cursor: nwse-resize;
      border-radius: 4px 0 10px 0;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .node:hover .resize-handle { opacity: 1; }

    .node-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content:center;
    }

    /* Text Node Variants */
    .text-node {
      background: rgba(42, 42, 58, 0.9);
      color: #fff;
      border: 2px solid;
      min-width: 200px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .text-node.blue { border-color: #3b82f6; }
    .text-node.purple { border-color: #a855f7; }
    .text-node.pink { border-color: #ec4899; }
    .text-node.red { border-color: #ef4444; }

    /* Mini-map */
    #minimap-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 200px;
      height: 130px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid var(--primary);
      border-radius: 12px;
      z-index: 10000;
      overflow: hidden;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #minimap-canvas { width: 100%; height: 100%; }
    #coords {
      position: absolute;
      bottom: 5px;
      right: 8px;
      color: var(--primary-hover);
      font-size: 10px;
      font-family: monospace;
    }

    /* UI Panels */
    #ui { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    .toolbar {
      background: var(--panel-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px;
      width: 280px;
      backdrop-filter: blur(12px);
    }
    .toolbar-section { margin-bottom: 16px; }
    .toolbar-label { color: #9ca3af; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; display: block; }
    
    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-btn { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
    .color-btn.active { border-color: white; transform: scale(1.1); }

    .icon-toolbar { display: flex; gap: 8px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 10px;
      background: rgba(255,255,255,0.1); border: none;
      color: white; cursor: pointer; font-size: 20px;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.2); }
    .icon-btn.active { background: var(--primary); box-shadow: 0 0 12px var(--primary); }

    #drawStatus {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ef4444;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      display: none;
      z-index: 9998;
      font-weight: bold;
    }
    #drawStatus.active { display: block; }

    /* User Info */
    #userInfo {
      position: fixed;
      top: 20px;
      left: 20px;
      background: var(--panel-bg);
      padding: 10px 15px;
      border-radius: 12px;
      z-index: 9999;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Rules Overlay */
    #rulesOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      backdrop-filter: blur(5px);
    }
    #stickyNote {
      background: #fef3c7;
      color: #92400e;
      padding: 30px;
      border-radius: 4px;
      width: 300px;
      transform: rotate(-1deg);
      box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="world"></div>

<div id="minimap-container">
  <canvas id="minimap-canvas"></canvas>
  <div id="coords">X: 0, Y: 0</div>
</div>

<div id="drawStatus">🖌️ Drawing Mode Active</div>

<div id="userInfo">
  <span id="username">👤 Guest</span> | <span id="userCity">🌍 World</span>
</div>

<div id="rulesOverlay">
  <div id="stickyNote">
    <h2 style="margin-top:0">📋 Rules</h2>
    <ul style="padding-left:20px">
      <li>No offensive content</li>
      <li>Be respectful</li>
      <li>Have fun!</li>
    </ul>
    <button onclick="closeRules()" style="width:100%; padding:10px; background:#d97706; color:white; border:none; cursor:pointer; font-weight:bold">Got it!</button>
  </div>
</div>

<div id="ui">
  <div class="toolbar">
    <div class="toolbar-section">
      <label class="toolbar-label">Text Color</label>
      <div class="color-picker">
        <button class="color-btn active" onclick="setTextColor('blue', event)" style="background:#3b82f6"></button>
        <button class="color-btn" onclick="setTextColor('purple', event)" style="background:#a855f7"></button>
        <button class="color-btn" onclick="setTextColor('pink', event)" style="background:#ec4899"></button>
        <button class="color-btn" onclick="setTextColor('red', event)" style="background:#ef4444"></button>
      </div>
    </div>

    <div class="toolbar-section">
      <label class="toolbar-label">Tools</label>
      <div class="icon-toolbar">
        <button class="icon-btn" onclick="addText()" title="Add Text">📝</button>
        <button class="icon-btn" onclick="addYT()" title="Add YouTube">▶️</button>
        <button class="icon-btn" id="drawBtn" onclick="toggleDraw()" title="Draw">🖌️</button>
        <button class="icon-btn" onclick="clearAll()" title="Clear All">🗑️</button>
      </div>
    </div>
  </div>
</div>

<script>
/** STATE & CONFIG **/
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const world = document.getElementById("world");
const miniCanvas = document.getElementById("minimap-canvas");
const miniCtx = miniCanvas.getContext("2d");

let cam = { x: 0, y: 0, zoom: 1 };
let objects = []; 
let strokes = [];
let currentStroke = null;
let drawMode = false;
let brushColor = "white";
let textColor = "blue";
let nextId = 0;

// Mock User
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || { username: "Guest", city: "Unknown" };
document.getElementById("username").textContent = "👤 " + currentUser.username;
document.getElementById("userCity").textContent = "🌍 " + currentUser.city;

/** INITIALIZATION **/
function init() {
  resize();
  window.addEventListener('resize', resize);
  loadData();
  animate();
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  render();
}

function closeRules() { document.getElementById("rulesOverlay").style.display = "none"; }

/** SAVE & LOAD SYSTEM **/
function saveData() {
  const data = {
    strokes: strokes,
    objects: objects.map(o => ({
      id: o.id,
      x: o.x,
      y: o.y,
      width: o.width,
      height: o.height,
      type: o.type,
      content: o.type === 'text' ? o.el.innerHTML : o.content,
      colorClass: o.colorClass
    }))
  };
  localStorage.setItem("world_canvas_v3", JSON.stringify(data));
}

function loadData() {
  const saved = localStorage.getItem("world_canvas_v3");
  if (!saved) return;
  const data = JSON.parse(saved);
  strokes = data.strokes || [];
  data.objects.forEach(obj => {
    if (obj.type === 'text') recreateText(obj);
    else if (obj.type === 'yt') recreateYT(obj);
  });
}

/** CORE RENDERING LOOP **/
function animate() {
  drawCanvas();
  updateMinimap();
  requestAnimationFrame(animate);
}

function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  strokes.forEach(s => {
    if (s.points.length < 2) return;
    ctx.beginPath();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = (s.size || 3) * cam.zoom;
    
    const start = toScreen(s.points[0]);
    ctx.moveTo(start.x, start.y);
    
    for (let i = 1; i < s.points.length; i++) {
      const p = toScreen(s.points[i]);
      ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  });
}

function render() {
  objects.forEach(o => {
    const pos = toScreen({ x: o.x, y: o.y });
    o.el.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(${cam.zoom})`;
    o.el.style.transformOrigin = "0 0";
  });
}

/** COORDINATE HELPERS **/
function toWorld(x, y) {
  return { x: (x / cam.zoom) + cam.x, y: (y / cam.zoom) + cam.y };
}

function toScreen(pos) {
  return { x: (pos.x - cam.x) * cam.zoom, y: (pos.y - cam.y) * cam.zoom };
}

/** OBJECT MANAGEMENT **/
function createNode(el, x, y, type, content = "", colorClass = "") {
  const id = nextId++;
  const obj = { id, el, x, y, width: 300, height: 200, type, content, colorClass };
  
  el.style.width = obj.width + "px";
  el.style.height = obj.height + "px";
  el.classList.add('node');
  
  // Controls
  const controls = document.createElement("div");
  controls.className = "node-controls";
  controls.innerHTML = `<button class="node-btn" onclick="deleteNode(${id})">✕</button>`;
  el.appendChild(controls);

  // Resize
  const resizer = document.createElement("div");
  resizer.className = "resize-handle";
  el.appendChild(resizer);

  initDragging(obj);
  initResizing(obj, resizer);
  
  objects.push(obj);
  world.appendChild(el);
  render();
  saveData();
  return obj;
}

function deleteNode(id) {
  const idx = objects.findIndex(o => o.id === id);
  if (idx > -1) {
    objects[idx].el.remove();
    objects.splice(idx, 1);
    saveData();
  }
}

function addText() {
  const el = document.createElement("div");
  el.className = "text-node " + textColor;
  el.contentEditable = true;
  el.innerHTML = "Type something...";
  el.oninput = () => saveData();
  const pos = toWorld(window.innerWidth/2 - 150, window.innerHeight/2 - 100);
  createNode(el, pos.x, pos.y, 'text', "", textColor);
}

function recreateText(data) {
  const el = document.createElement("div");
  el.className = "text-node " + data.colorClass;
  el.contentEditable = true;
  el.innerHTML = data.content;
  el.oninput = () => saveData();
  const o = createNode(el, data.x, data.y, 'text', "", data.colorClass);
  o.width = data.width; o.height = data.height;
  el.style.width = o.width + "px"; el.style.height = o.height + "px";
}

function addYT() {
  const url = prompt("YouTube URL (e.g., https://www.youtube.com/watch?v=dQw4w9WgXcQ)");
  if (!url) return;
  let id = "";
  if (url.includes("v=")) id = url.split("v=")[1].split("&")[0];
  else id = url.split("/").pop();

  const el = document.createElement("div");
  el.style.padding = "0";
  el.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" style="width:100%;height:100%;border-radius:10px;pointer-events:auto;" frameborder="0" allowfullscreen></iframe>`;
  const pos = toWorld(window.innerWidth/2 - 150, window.innerHeight/2 - 100);
  createNode(el, pos.x, pos.y, 'yt', id);
}

function recreateYT(data) {
  const el = document.createElement("div");
  el.style.padding = "0";
  el.innerHTML = `<iframe src="https://www.youtube.com/embed/${data.content}" style="width:100%;height:100%;border-radius:10px;" frameborder="0" allowfullscreen></iframe>`;
  const o = createNode(el, data.x, data.y, 'yt', data.content);
  o.width = data.width; o.height = data.height;
  el.style.width = o.width + "px"; el.style.height = o.height + "px";
}

/** INTERACTION LOGIC **/
function initDragging(obj) {
  let isDragging = false;
  let startMouse = { x: 0, y: 0 }, startObj = { x: 0, y: 0 };

  obj.el.addEventListener('mousedown', (e) => {
    if (drawMode || e.target.closest('.node-controls') || e.target.classList.contains('resize-handle')) return;
    isDragging = true;
    startMouse = { x: e.clientX, y: e.clientY };
    startObj = { x: obj.x, y: obj.y };
    obj.el.classList.add('selected');
    e.stopPropagation();
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    obj.x = startObj.x + (e.clientX - startMouse.x) / cam.zoom;
    obj.y = startObj.y + (e.clientY - startMouse.y) / cam.zoom;
    render();
  });

  window.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; obj.el.classList.remove('selected'); saveData(); }
  });
}

function initResizing(obj, handle) {
  let isResizing = false;
  let startMouse = { x: 0, y: 0 }, startSize = { w: 0, h: 0 };

  handle.addEventListener('mousedown', (e) => {
    isResizing = true;
    startMouse = { x: e.clientX, y: e.clientY };
    startSize = { w: obj.width, h: obj.height };
    e.stopPropagation(); e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    obj.width = Math.max(100, startSize.w + (e.clientX - startMouse.x) / cam.zoom);
    obj.height = Math.max(100, startSize.h + (e.clientY - startMouse.y) / cam.zoom);
    obj.el.style.width = obj.width + "px";
    obj.el.style.height = obj.height + "px";
  });

  window.addEventListener('mouseup', () => { if (isResizing) { isResizing = false; saveData(); } });
}

/** CAMERA & DRAWING **/
let isPanning = false, lastMouse = { x: 0, y: 0 };

canvas.addEventListener('mousedown', (e) => {
  if (drawMode) {
    const pos = toWorld(e.clientX, e.clientY);
    currentStroke = { points: [pos], color: brushColor, size: 3 };
    strokes.push(currentStroke);
  } else {
    isPanning = true;
    lastMouse = { x: e.clientX, y: e.clientY };
  }
});

window.addEventListener('mousemove', (e) => {
  if (isPanning) {
    cam.x -= (e.clientX - lastMouse.x) / cam.zoom;
    cam.y -= (e.clientY - lastMouse.y) / cam.zoom;
    lastMouse = { x: e.clientX, y: e.clientY };
    render();
  } else if (drawMode && currentStroke) {
    currentStroke.points.push(toWorld(e.clientX, e.clientY));
  }
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  if (currentStroke) { currentStroke = null; saveData(); }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const mouseBefore = toWorld(e.clientX, e.clientY);
  cam.zoom *= (e.deltaY < 0) ? 1.1 : 0.9;
  cam.zoom = Math.max(0.1, Math.min(5, cam.zoom));
  const mouseAfter = toWorld(e.clientX, e.clientY);
  cam.x += (mouseBefore.x - mouseAfter.x);
  cam.y += (mouseBefore.y - mouseAfter.y);
  render();
}, { passive: false });

/** MINIMAP LOGIC **/
function updateMinimap() {
  miniCanvas.width = 200; miniCanvas.height = 130;
  miniCtx.clearRect(0, 0, 200, 130);
  
  const centerX = 100, centerY = 65;
  const scale = 0.04; // Adjust for zoom level of map

  // Draw Objects
  miniCtx.fillStyle = "#7c3aed";
  objects.forEach(o => {
    const mx = centerX + (o.x - cam.x) * scale;
    const my = centerY + (o.y - cam.y) * scale;
    miniCtx.fillRect(mx, my, o.width * scale, o.height * scale);
  });

  // Draw Viewport
  miniCtx.strokeStyle = "white";
  miniCtx.lineWidth = 1;
  const vw = (window.innerWidth / cam.zoom) * scale;
  const vh = (window.innerHeight / cam.zoom) * scale;
  miniCtx.strokeRect(centerX, centerY, vw, vh);

  document.getElementById("coords").textContent = `X: ${Math.round(cam.x)}, Y: ${Math.round(cam.y)}`;
}

/** UI HELPERS **/
function toggleDraw() {
  drawMode = !drawMode;
  document.getElementById("drawBtn").classList.toggle("active");
  document.getElementById("drawStatus").classList.toggle("active");
}

function setTextColor(color, e) {
  textColor = color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
}

function clearAll() {
  if (confirm("Delete everything? This cannot be undone.")) {
    objects.forEach(o => o.el.remove());
    objects = []; strokes = [];
    saveData(); render();
  }
}

init();
</script>
</body>
</html>
