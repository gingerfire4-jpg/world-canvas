<!DOCTYPE html>
<html>
<head>
<title>World Canvas (Move + Infinite)</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

/* WORLD */
#world {
  position:absolute;
  width:20000px;
  height:20000px;
  background:#f9f9f9;
  transform-origin:0 0;
}

/* RULES */
#rules {
  position:fixed;
  top:20px;
  left:20px;
  background:#0b1b3a;
  color:white;
  padding:15px;
  border-radius:10px;
  z-index:1000;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;
}

#plus {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* OBJECTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:grab;
}

iframe {
  position:absolute;
  width:320px;
  height:200px;
  border:none;
  cursor:grab;
}

/* DRAW */
canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  z-index:500;
}
</style>
</head>

<body>

<div id="world"></div>

<div id="rules">
  <h3>Rules Hub</h3>
  <p>Spawn point</p>
</div>

<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="createText()">🔤 Text</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>
    <div class="item" onclick="createYT()">📺 YouTube</div>
  </div>
</div>

<canvas id="draw"></canvas>

<script>
const world = document.getElementById("world");

/* CAMERA */
let offsetX = 0;
let offsetY = 0;
let scale = 1;

/* MENU */
const plus = document.getElementById("plus");
const menu = document.getElementById("menu");

plus.onclick = () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* DRAG SYSTEM */
let dragEl = null;
let draggingWorld = false;

document.addEventListener("mousedown",(e)=>{
  if(e.target.classList.contains("node") || e.target.tagName==="IFRAME"){
    dragEl = e.target;
  } else {
    draggingWorld = true;
  }
});

document.addEventListener("mousemove",(e)=>{
  if(dragEl){
    dragEl.style.left = (parseFloat(dragEl.style.left||0)+e.movementX)+"px";
    dragEl.style.top  = (parseFloat(dragEl.style.top||0)+e.movementY)+"px";
    return;
  }

  if(draggingWorld){
    offsetX += e.movementX;
    offsetY += e.movementY;
    updateCamera();
  }
});

document.addEventListener("mouseup",()=>{
  dragEl = null;
  draggingWorld = false;
});

/* ZOOM */
document.addEventListener("wheel",(e)=>{
  e.preventDefault();

  const oldScale = scale;
  scale -= e.deltaY * 0.001;
  scale = Math.max(0.3, Math.min(3, scale));

  const mx = e.clientX;
  const my = e.clientY;

  offsetX = mx - (mx - offsetX) * (scale / oldScale);
  offsetY = my - (my - offsetY) * (scale / oldScale);

  updateCamera();
},{passive:false});

function updateCamera(){
  world.style.transform =
    `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

/* TEXT */
function createText(){
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Drag me";
  el.style.left = "300px";
  el.style.top = "300px";
  world.appendChild(el);
}

/* YOUTUBE */
function createYT(){
  let url = prompt("Paste YouTube link:");
  if(!url) return;

  let id;

  if(url.includes("v=")){
    id = url.split("v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1];
  }

  if(!id){
    alert("Invalid link");
    return;
  }

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/"+id;
  iframe.style.left = "400px";
  iframe.style.top = "300px";

  world.appendChild(iframe);
}

/* DRAW */
let canvas = document.getElementById("draw");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let drawing = false;
let drawMode = false;

function toggleDraw(){
  drawMode = !drawMode;
  canvas.style.pointerEvents = drawMode ? "auto" : "none";
  alert("Draw: " + (drawMode ? "ON" : "OFF"));
}

canvas.addEventListener("mousedown",()=>{ if(drawMode) drawing=true; });
canvas.addEventListener("mouseup",()=>drawing=false);

canvas.addEventListener("mousemove",(e)=>{
  if(drawing){
    ctx.fillRect(e.clientX, e.clientY, 3, 3);
  }
});
</script>

</body>
</html>
