<!DOCTYPE html>
<html>
<head>
<title>World Canvas FIXED</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

/* WORLD */
#world {
  position:absolute;
  width:10000px;
  height:10000px;
  background:#fafafa;
}

/* RULES (fixed UI) */
#rules {
  position:fixed;
  top:20px;
  left:20px;
  background:#0b1b3a;
  color:white;
  padding:15px;
  border-radius:10px;
  z-index:1000;
}

/* UI */
#ui {
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;
}

#plus {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b1b3a;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
}

#menu {
  display:none;
  margin-top:10px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
}

.item {
  padding:10px;
  cursor:pointer;
}
.item:hover { background:#eee; }

/* ELEMENTS */
.node {
  position:absolute;
  padding:8px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:grab;
}

iframe {
  position:absolute;
  width:320px;
  height:200px;
  border:none;
  cursor:grab;
}

/* DRAW */
canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  z-index:500;
}
</style>
</head>

<body>

<div id="world"></div>

<div id="rules">
  <h3>Rules Hub</h3>
  <p>Spawn point</p>
</div>

<div id="ui">
  <button id="plus">+</button>
  <div id="menu">
    <div class="item" onclick="createText()">🔤 Text</div>
    <div class="item" onclick="toggleDraw()">🎨 Draw</div>
    <div class="item" onclick="createYT()">📺 YouTube</div>
  </div>
</div>

<canvas id="draw"></canvas>

<script>
const world = document.getElementById("world");

/* MENU */
const plus = document.getElementById("plus");
const menu = document.getElementById("menu");

plus.onclick = () => {
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
};

/* DRAG SYSTEM */
let current = null;

document.addEventListener("mousedown",(e)=>{
  if(e.target.classList.contains("node") || e.target.tagName==="IFRAME"){
    current = e.target;
  }
});

document.addEventListener("mousemove",(e)=>{
  if(current){
    current.style.left = (parseFloat(current.style.left||0)+e.movementX)+"px";
    current.style.top  = (parseFloat(current.style.top||0)+e.movementY)+"px";
  }
});

document.addEventListener("mouseup",()=>current=null);

/* TEXT */
function createText(){
  const el = document.createElement("div");
  el.className = "node";
  el.contentEditable = true;
  el.innerText = "Drag me";
  el.style.left = "300px";
  el.style.top = "300px";
  world.appendChild(el);
}

/* YOUTUBE */
function createYT(){
  let url = prompt("Paste YouTube link:");
  if(!url) return;

  let id;

  if(url.includes("v=")){
    id = url.split("v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1];
  }

  if(!id){
    alert("Invalid link");
    return;
  }

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/"+id;
  iframe.style.left = "400px";
  iframe.style.top = "300px";

  world.appendChild(iframe);
}

/* DRAW */
let canvas = document.getElementById("draw");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let drawing = false;
let drawMode = false;

function toggleDraw(){
  drawMode = !drawMode;
  canvas.style.pointerEvents = drawMode ? "auto" : "none";
  alert("Draw mode: " + (drawMode ? "ON" : "OFF"));
}

canvas.addEventListener("mousedown",()=>{ if(drawMode) drawing=true; });
canvas.addEventListener("mouseup",()=>drawing=false);

canvas.addEventListener("mousemove",(e)=>{
  if(drawing){
    ctx.fillRect(e.clientX, e.clientY, 3, 3);
  }
});
</script>

</body>
</html>
