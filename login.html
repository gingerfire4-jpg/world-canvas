<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas - Login</title>

<style>
body {
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container {
  background:white;
  border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
  overflow:hidden;
  width:100%;
  max-width:400px;
  margin:20px;
}

.header {
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color:white;
  padding:30px;
  text-align:center;
}

.header h1 {
  margin:0;
  font-size:28px;
  margin-bottom:5px;
}

.header p {
  margin:0;
  opacity:0.9;
  font-size:14px;
}

.tabs {
  display:flex;
  border-bottom:1px solid #eee;
}

.tab {
  flex:1;
  padding:15px;
  text-align:center;
  cursor:pointer;
  background:#f9f9f9;
  border:none;
  font-size:14px;
  font-weight:bold;
  color:#666;
  transition:all 0.3s;
}

.tab.active {
  background:white;
  color:#667eea;
  border-bottom:3px solid #667eea;
  margin-bottom:-1px;
}

.tab:hover {
  background:#f5f5f5;
}

.content {
  padding:30px;
}

.form-group {
  margin-bottom:15px;
}

.form-group label {
  display:block;
  margin-bottom:5px;
  color:#333;
  font-weight:bold;
  font-size:13px;
}

.form-group input {
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:6px;
  box-sizing:border-box;
  font-size:14px;
  transition:border-color 0.3s;
}

.form-group input:focus {
  outline:none;
  border-color:#667eea;
  box-shadow:0 0 0 3px rgba(102,126,234,0.1);
}

.form-group select {
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:6px;
  box-sizing:border-box;
  font-size:14px;
  cursor:pointer;
}

.form-group select:focus {
  outline:none;
  border-color:#667eea;
  box-shadow:0 0 0 3px rgba(102,126,234,0.1);
}

.btn {
  width:100%;
  padding:12px;
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color:white;
  border:none;
  border-radius:6px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:transform 0.2s, box-shadow 0.2s;
  margin-top:10px;
}

.btn:hover {
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(102,126,234,0.4);
}

.btn:active {
  transform:translateY(0);
}

.error {
  background:#fee;
  color:#c33;
  padding:10px;
  border-radius:6px;
  margin-bottom:15px;
  font-size:13px;
  border-left:4px solid #c33;
  display:none;
}

.success {
  background:#efe;
  color:#3c3;
  padding:10px;
  border-radius:6px;
  margin-bottom:15px;
  font-size:13px;
  border-left:4px solid #3c3;
  display:none;
}

.tab-content {
  display:none;
}

.tab-content.active {
  display:block;
}

.footer {
  text-align:center;
  padding:15px;
  color:#999;
  font-size:12px;
  border-top:1px solid #eee;
}

.city-list {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  max-height:200px;
  overflow-y:auto;
  margin-top:8px;
  padding:8px;
  border:1px solid #ddd;
  border-radius:6px;
  font-size:12px;
}

.city-option {
  padding:6px;
  background:#f5f5f5;
  border-radius:4px;
  cursor:pointer;
  transition:all 0.2s;
}

.city-option:hover {
  background:#667eea;
  color:white;
}

</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🌍 World Canvas</h1>
    <p>Collaborate. Create. Connect.</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Login</button>
    <button class="tab" onclick="switchTab('register')">Register</button>
  </div>

  <div class="content">
    <!-- LOGIN TAB -->
    <div id="login" class="tab-content active">
      <div class="error" id="loginError"></div>
      <div class="form-group">
        <label>📧 Email</label>
        <input type="text" id="loginEmail" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
      </div>
      <button class="btn" onclick="handleLogin()">Login</button>
    </div>

    <!-- REGISTER TAB -->
    <div id="register" class="tab-content">
      <div class="error" id="registerError"></div>
      <div class="success" id="registerSuccess"></div>
      
      <div class="form-group">
        <label>👤 Username</label>
        <input type="text" id="regUsername" placeholder="Choose a username (min 3 chars)">
      </div>

      <div class="form-group">
        <label>📧 Email</label>
        <input type="text" id="regEmail" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" id="regPassword" placeholder="Create a password (min 6 chars)">
      </div>

      <div class="form-group">
        <label>📱 Phone Number</label>
        <input type="text" id="regPhone" placeholder="Enter your phone number">
      </div>

      <div class="form-group">
        <label>🌍 City (for Weather Widget)</label>
        <input type="text" id="regCity" placeholder="Enter your city" onkeyup="filterCities()">
        <div class="city-list" id="cityList"></div>
      </div>

      <button class="btn" onclick="handleRegister()">Create Account</button>
    </div>
  </div>

  <div class="footer">
    <p>Be respectful. Be creative. Have fun! 🎨</p>
  </div>
</div>

<script>

// Popular cities for suggestions
const cities=[
  "London", "New York", "Los Angeles", "Chicago", "Houston",
  "Phoenix", "Philadelphia", "San Antonio", "San Diego", "Dallas",
  "Paris", "Tokyo", "Sydney", "Toronto", "Dubai",
  "Singapore", "Hong Kong", "Bangkok", "Barcelona", "Amsterdam",
  "Berlin", "Madrid", "Rome", "Moscow", "Istanbul",
  "Mexico City", "São Paulo", "Buenos Aires", "Cairo", "Mumbai",
  "Delhi", "Bangkok", "Jakarta", "Seoul", "Shanghai",
  "Beijing", "Hong Kong", "Singapore", "Bangkok", "Manila"
];

// Load or create user database
let users=JSON.parse(localStorage.getItem("users")) || [];

function switchTab(tab){
  document.querySelectorAll(".tab-content").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  
  document.getElementById(tab).classList.add("active");
  event.target.classList.add("active");
  
  // Clear messages
  document.getElementById("loginError").style.display="none";
  document.getElementById("registerError").style.display="none";
  document.getElementById("registerSuccess").style.display="none";
}

function filterCities(){
  let input=document.getElementById("regCity").value.toLowerCase();
  let list=document.getElementById("cityList");
  list.innerHTML="";
  
  if(input.length<1){
    return;
  }
  
  let filtered=cities.filter(c=>c.toLowerCase().includes(input));
  
  filtered.forEach(city=>{
    let div=document.createElement("div");
    div.className="city-option";
    div.textContent=city;
    div.onclick=()=>{
      document.getElementById("regCity").value=city;
      list.innerHTML="";
    };
    list.appendChild(div);
  });
}

function handleLogin(){
  let email=document.getElementById("loginEmail").value.trim();
  let password=document.getElementById("loginPassword").value;
  let errorEl=document.getElementById("loginError");
  
  errorEl.style.display="none";
  
  if(!email || !password){
    errorEl.textContent="❌ Please fill in all fields";
    errorEl.style.display="block";
    return;
  }
  
  let user=users.find(u=>u.email===email && u.password===password);
  
  if(!user){
    errorEl.textContent="❌ Email or password incorrect";
    errorEl.style.display="block";
    return;
  }
  
  // Login successful
  localStorage.setItem("currentUser",JSON.stringify({
    username:user.username,
    email:user.email,
    city:user.city,
    phone:user.phone
  }));
  
  window.location.href="index.html";
}

function handleRegister(){
  let username=document.getElementById("regUsername").value.trim();
  let email=document.getElementById("regEmail").value.trim();
  let password=document.getElementById("regPassword").value;
  let phone=document.getElementById("regPhone").value.trim();
  let city=document.getElementById("regCity").value.trim();
  
  let errorEl=document.getElementById("registerError");
  let successEl=document.getElementById("registerSuccess");
  
  errorEl.style.display="none";
  successEl.style.display="none";
  
  // Validation
  if(!username || !email || !password || !phone || !city){
    errorEl.textContent="❌ Please fill in all fields";
    errorEl.style.display="block";
    return;
  }
  
  if(username.length<3){
    errorEl.textContent="❌ Username must be at least 3 characters";
    errorEl.style.display="block";
    return;
  }
  
  if(password.length<6){
    errorEl.textContent="❌ Password must be at least 6 characters";
    errorEl.style.display="block";
    return;
  }
  
  if(!email.includes("@")){
    errorEl.textContent="❌ Please enter a valid email";
    errorEl.style.display="block";
    return;
  }
  
  // Check for duplicate username
  if(users.find(u=>u.username===username)){
    errorEl.textContent="❌ Username already taken";
    errorEl.style.display="block";
    return;
  }
  
  // Check for duplicate email
  if(users.find(u=>u.email===email)){
    errorEl.textContent="❌ Email already registered";
    errorEl.style.display="block";
    return;
  }
  
  // Create new user
  let newUser={
    username,
    email,
    password,
    phone,
    city
  };
  
  users.push(newUser);
  localStorage.setItem("users",JSON.stringify(users));
  
  // Show success message
  successEl.textContent="✅ Account created! Logging you in...";
  successEl.style.display="block";
  
  // Auto-login after 1.5 seconds
  setTimeout(()=>{
    localStorage.setItem("currentUser",JSON.stringify({
      username:newUser.username,
      email:newUser.email,
      city:newUser.city,
      phone:newUser.phone
    }));
    window.location.href="index.html";
  },1500);
}

// Allow enter key to submit
document.getElementById("loginPassword").addEventListener("keypress",(e)=>{
  if(e.key==="Enter") handleLogin();
});

document.getElementById("regCity").addEventListener("keypress",(e)=>{
  if(e.key==="Enter") handleRegister();
});

</script>

</body>
</html>
