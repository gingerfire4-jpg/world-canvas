<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>World Canvas - Login</title>

<style>
body {
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container {
  background:white;
  border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
  overflow:hidden;
  width:100%;
  max-width:400px;
  margin:20px;
}

.header {
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color:white;
  padding:30px;
  text-align:center;
}

.header h1 {
  margin:0;
  font-size:28px;
  margin-bottom:5px;
}

.header p {
  margin:0;
  opacity:0.9;
  font-size:14px;
}

.tabs {
  display:flex;
  border-bottom:1px solid #eee;
}

.tab {
  flex:1;
  padding:15px;
  text-align:center;
  cursor:pointer;
  background:#f9f9f9;
  border:none;
  font-size:14px;
  font-weight:bold;
  color:#666;
  transition:all 0.3s;
}

.tab.active {
  background:white;
  color:#667eea;
  border-bottom:3px solid #667eea;
  margin-bottom:-1px;
}

.tab:hover {
  background:#f5f5f5;
}

.content {
  padding:30px;
}

.form-group {
  margin-bottom:15px;
}

.form-group label {
  display:block;
  margin-bottom:5px;
  color:#333;
  font-weight:bold;
  font-size:13px;
}

.form-group input {
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:6px;
  box-sizing:border-box;
  font-size:14px;
  transition:border-color 0.3s;
